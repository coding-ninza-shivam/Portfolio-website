    </linearGradient>
  </defs>
  <!-- Window frame -->
  <rect x="4" y="6" width="40" height="36" rx="6" fill="url(#tkWin)" stroke="#334155" stroke-width="1.5" />
  
  <!-- Window titlebar -->
