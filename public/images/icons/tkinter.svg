  <!-- Window buttons -->
  <circle cx="9" cy="10.5" r="1.8" fill="#EF4444" />
  <circle cx="14" cy="10.5" r="1.8" fill="#F59E0B" />
  <circle cx="19" cy="10.5" r="1.8" fill="#10B981" />
  
  <!-- GUI Elements inside Window -->
  <!-- Sidebar -->
