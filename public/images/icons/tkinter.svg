  <!-- Content cards/widgets -->
  <rect x="19" y="19" width="21" height="8" rx="2" fill="url(#pyBlue)" opacity="0.9" />
  <!-- Text line placeholder -->
  <rect x="22" y="22" width="10" height="2" rx="1" fill="#FFFFFF" />
  
  <!-- GUI Button (Python Yellow accent) -->
  <rect x="19" y="29" width="12" height="9" rx="2" fill="url(#pyYellow)" />
